name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "*" ]
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Cargo registry and target directory
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure rustfmt and clippy are installed
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features

      - name: Build all targets (debug)
        run: cargo build --all-targets --all-features --locked

      - name: Build release binaries
        run: cargo build --release --all-features --locked

      - name: Upload mk-client release binary
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v3-node20
        with:
          name: mk-client
          path: target/release/mk-client

      - name: Upload mk-mcp release binary
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v3-node20
        with:
          name: mk-mcp
          path: target/release/mk-mcp

  unit-test:
    name: Unit Tests
    needs: build
    runs-on: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit and documentation tests
        run: cargo test --all-features --locked

  functional-test:
    name: Functional Tests (RouterOS)
    needs: unit-test
    runs-on: rust
    concurrency:
      group: mikrotik-router-functional-tests
      cancel-in-progress: false
    env:
      MIKROTIK_ADDR: ${{ vars.MIKROTIK_TEST_ADDR }}
      MIKROTIK_USER: ${{ secrets.MIKROTIK_TEST_USER }}
      MIKROTIK_PASS: ${{ secrets.MIKROTIK_TEST_PASS }}
      MIKROTIK_CA_CERT: ${{ secrets.MIKROTIK_TEST_CA }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Configure Test CA certificate
        if: env.MIKROTIK_CA_CERT != ''
        run: |
          CA_DIR="${RUNNER_TEMP:-/tmp}/mikrotik-ca"
          mkdir -p "$CA_DIR"
          echo "$MIKROTIK_CA_CERT" > "$CA_DIR/mikrotik-test-ca.crt"
          echo "MIKROTIK_CA_FILE=$CA_DIR/mikrotik-test-ca.crt" >> "$GITHUB_ENV"

          # Prepare combined CA bundle if system bundle exists so external TLS continues working
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cat /etc/ssl/certs/ca-certificates.crt "$CA_DIR/mikrotik-test-ca.crt" > "$CA_DIR/combined-ca.crt"
            echo "SSL_CERT_FILE=$CA_DIR/combined-ca.crt" >> "$GITHUB_ENV"
          elif [ -f /etc/ssl/cert.pem ]; then
            cat /etc/ssl/cert.pem "$CA_DIR/mikrotik-test-ca.crt" > "$CA_DIR/combined-ca.crt"
            echo "SSL_CERT_FILE=$CA_DIR/combined-ca.crt" >> "$GITHUB_ENV"
          else
            echo "SSL_CERT_FILE=$CA_DIR/mikrotik-test-ca.crt" >> "$GITHUB_ENV"
          fi

      - name: Run functional tests against RouterOS
        run: cargo test --test functional --locked -- --ignored --test-threads=1 --nocapture

