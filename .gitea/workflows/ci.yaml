name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "*" ]
    tags: [ "v*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Cargo registry and target directory
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Ensure rustfmt and clippy are installed
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets

      - name: Build all targets (debug)
        run: cargo build --all-targets --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Upload mk-client release binary
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v3-node20
        with:
          name: mk-client
          path: target/release/mk-client

  unit-test:
    name: Unit Tests
    needs: build
    runs-on: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run unit tests
        run: cargo test --lib --bins --locked

  functional-test:
    name: Functional Tests (RouterOS)
    needs: unit-test
    runs-on: rust
    concurrency:
      group: mikrotik-router-functional-tests
      cancel-in-progress: false
    env:
      MIKROTIK_ADDR: ${{ vars.MIKROTIK_TEST_ADDR }}
      MIKROTIK_USER: ${{ secrets.MIKROTIK_TEST_USER }}
      MIKROTIK_PASS: ${{ secrets.MIKROTIK_TEST_PASS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore Cargo cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run functional tests against RouterOS
        run: cargo test --test functional --locked -- --ignored --test-threads=1 --nocapture

