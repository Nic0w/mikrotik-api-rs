[workspace]
members = [
    "crates/mikrotik-api",
    "crates/mk-client",
    "crates/mk-mcp",
    "crates/tree-extractor",
]
resolver = "2"

[profile.release]
lto = true
strip = true

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
license-file = "LICENSE"
repository = "https://github.com/Nic0w/mikrotik-api-rs"
homepage = "https://github.com/Nic0w/mikrotik-api-rs"
readme = "README.md"

[workspace.dependencies]
# Internal workspace crates
mikrotik_api = { path = "crates/mikrotik-api", version = "0.5.0" }

# Shared core dependencies
bytes = "1.12.1"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.34"
futures = "0.3.34"

# TLS dependencies
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "1.0"

# CLI dependencies
clap = { version = "4.6.7", features = ["derive", "env"] }
dialoguer = "0.12.0"
simple_logger = { version = "5.2.0", features = ["stderr"] }
human_bytes = "0.4.3"

# MCP dependencies
rmcp = { version = "3.8.0", features = ["macros", "server", "transport-io"] }
schemars = "1.2"
